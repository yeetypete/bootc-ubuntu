# Without these the bootc module silently fails to install its unit. dracut
# exits 0 and the initramfs has no bootc-root-setup.service, so it cannot mount
# the root.
systemdsystemconfdir=/etc/systemd/system
systemdsystemunitdir=/usr/lib/systemd/system

# The bootc dracut module never auto-installs and must be requested. It sets up
# /sysroot as a composefs deployment and pulls in the erofs + overlay modules.
add_dracutmodules+=" bootc "

# Unlock a LUKS root in the initramfs, for an install that encrypted one.
# tpm2-tss is requested explicitly because its dracut module only installs
# itself when another module pulls it in.
add_dracutmodules+=" crypt systemd-cryptsetup tpm2-tss "

# console-setup names the keymap it stages with mktemp, so the initramfs
# differs on every build. Omitting it leaves the kernel's built-in keymap,
# which matches the us layout this image ships.
omit_dracutmodules+=" console-setup "
