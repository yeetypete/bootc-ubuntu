# Root filling the rest of the disk.
#
# No Encrypt= here. bootc-ubuntu-install appends the mode --encrypt asks for to
# a copy of this file, so the root is LUKS2 only when it is asked for.
#
# NOTE: the root filesystem needs verity. repart does not format with it by
# default, so run with SYSTEMD_REPART_MKFS_OPTIONS_EXT4="-O verity".
[Partition]
Type=root
Format=ext4
Label=root
