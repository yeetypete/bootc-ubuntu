# Install-time layout, passed to systemd-repart --definitions. Kept out of
# /usr/lib/repart.d, where systemd-repart.service would apply it at boot.
#
# systemd-boot keeps every kernel and initramfs on the ESP rather than a
# separate /boot, and bootc retains several deployments, so 512M is too small.
[Partition]
Type=esp
Format=vfat
Label=esp
SizeMinBytes=1G
SizeMaxBytes=1G
