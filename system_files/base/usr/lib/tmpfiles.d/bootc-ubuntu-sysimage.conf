# Package manager state lives in /usr/lib/sysimage, where it persists across
# image updates (/var is only applied at first provisioning). Symlink the paths
# the tools expect to it.
L+ /var/lib/dpkg - - - - /usr/lib/sysimage/dpkg
L+ /var/lib/pam - - - - /usr/lib/sysimage/pam
L+ /var/lib/ucf - - - - /usr/lib/sysimage/ucf
L+ /var/cache/debconf - - - - /usr/lib/sysimage/debconf
L+ /var/lib/systemd/deb-systemd-helper-enabled - - - - /usr/lib/sysimage/deb-systemd-helper-enabled
L+ /var/lib/systemd/deb-systemd-user-helper-enabled - - - - /usr/lib/sysimage/deb-systemd-user-helper-enabled
