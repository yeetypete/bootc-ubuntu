# Accounts and groups the desktop packages' maintainer scripts create, which
# ship no sysusers.d of their own.
g docker -
g lpadmin -
g onepassword -
g onepassword-mcp -
g scanner -
u avahi - "Avahi mDNS daemon" /run/avahi-daemon /usr/sbin/nologin
u cups-pk-helper - "user for cups-pk-helper service" /nonexistent /usr/sbin/nologin
u geoclue - "Geoinformation service" /var/lib/geoclue /usr/sbin/nologin
u nvidia-persistenced - "NVIDIA Persistence Daemon" /nonexistent /usr/sbin/nologin
u saned - "SANE scanner daemon" /var/lib/saned /usr/sbin/nologin
u usbmux - "usbmux daemon" /var/lib/usbmux /usr/sbin/nologin
