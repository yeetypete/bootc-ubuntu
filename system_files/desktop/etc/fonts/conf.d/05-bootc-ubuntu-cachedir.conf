<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fonts.conf includes this directory before declaring its own cache
     directory, so this one is preferred. /var/cache/fontconfig would not
     reach an installed system, because the image ships /var empty. -->
<fontconfig>
  <cachedir>/usr/lib/fontconfig/cache</cachedir>
</fontconfig>
