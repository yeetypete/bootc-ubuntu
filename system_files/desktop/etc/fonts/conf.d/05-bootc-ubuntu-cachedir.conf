<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fonts.conf includes this directory before declaring its own cache
     directory, so this one wins. /var/cache/fontconfig would not reach an
     installed system, which starts with /var empty. -->
<fontconfig>
  <cachedir>/usr/lib/fontconfig/cache</cachedir>
</fontconfig>
