# Run when any host key is missing or empty, rather than only on first boot.
# Matches Fedora's sshd-keygen@.service conditions:
# https://src.fedoraproject.org/rpms/openssh/blob/rawhide/f/sshd-keygen@.service
[Unit]
ConditionFirstBoot=
ConditionFileNotEmpty=|!/etc/ssh/ssh_host_rsa_key
ConditionFileNotEmpty=|!/etc/ssh/ssh_host_ecdsa_key
ConditionFileNotEmpty=|!/etc/ssh/ssh_host_ed25519_key
