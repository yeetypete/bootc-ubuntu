# Provision a machine's login from systemd credentials instead of the image.
# The stock unit imports root's password credentials only, so a credential
# naming any other account never reaches sysusers. Widening the import lets
# sysusers.extra carry the account and passwd.hashed-password.NAME its password.

[Service]
ImportCredential=passwd.hashed-password.*
ImportCredential=passwd.plaintext-password.*
ImportCredential=passwd.shell.*
