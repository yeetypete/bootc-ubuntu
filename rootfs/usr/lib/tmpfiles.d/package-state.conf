# Directories a package ships in /var, which /var starting empty would otherwise
# leave missing, and that neither a StateDirectory= nor the service itself creates.
d /var/lib/ubuntu-advantage 0755 root root -
d /var/lib/ubuntu-release-upgrader 0755 root root -
d /var/lib/update-notifier 0755 root root -
d /var/lib/update-notifier/package-data-downloads 0755 root root -
d /var/lib/update-notifier/package-data-downloads/partial 0700 _apt root -
d /var/lib/update-notifier/user.d 0755 root root -
d /var/spool/anacron 0755 root root -
