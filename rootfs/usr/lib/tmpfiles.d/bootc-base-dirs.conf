# Back the toplevel symlinks created in the image. /var starts empty on a fresh
# install, so these must be recreated at boot rather than shipped in the image.
d /run/media 0755 root root -
d /var/home 0755 root root -
d /var/roothome 0700 root root -
d /var/srv 0755 root root -
d /var/mnt 0755 root root -
