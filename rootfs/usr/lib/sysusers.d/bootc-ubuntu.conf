# Accounts and groups created by package maintainer scripts that ship no
# sysusers.d of their own.
g _ssh -
g lpadmin -
g netdev -
g rdma -
g scanner -
g ssl-cert -
u avahi - "Avahi mDNS daemon" /run/avahi-daemon /usr/sbin/nologin
u cups-browsed - "CUPS Remote Printer Browsing" /nonexistent /usr/sbin/nologin
u cups-pk-helper - "user for cups-pk-helper service" /nonexistent /usr/sbin/nologin
u geoclue - "Geoinformation service" /var/lib/geoclue /usr/sbin/nologin
u hplip - "HPLIP system user" /run/hplip /bin/false
u saned - "SANE scanner daemon" /var/lib/saned /usr/sbin/nologin
u speech-dispatcher - "Speech Dispatcher" /run/speech-dispatcher /bin/false
u sssd - "SSSD system user" /var/lib/sss /usr/sbin/nologin
u usbmux - "usbmux daemon" /var/lib/usbmux /usr/sbin/nologin
