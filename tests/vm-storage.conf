# Podman storage for the just disk-script VM: layer the writable store over the
# host's image store, mounted read-only by bcvk, so the image the VM was booted
# from is runnable without pulling it.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
additionalimagestores = ["/run/virtiofs-mnt-hoststorage"]
